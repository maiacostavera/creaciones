<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ilustración del kit de cumpleaños: caja con bolsita, golosinas y globo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2EDFC"/><stop offset="100%" stop-color="#D4C8F2"/>
    </linearGradient>
    <pattern id="puntos" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="16" cy="16" r="3" fill="#7F63CB" opacity="0.13"/>
    </pattern>
    <linearGradient id="gCaja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EFE6FB"/>
    </linearGradient>
    <linearGradient id="gBolsa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBB6D6"/><stop offset="100%" stop-color="#E5559B"/>
    </linearGradient>
    <linearGradient id="gGlobo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7E6F8"/><stop offset="100%" stop-color="#6FB6E0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#fondo)"/>
  <rect width="800" height="800" fill="url(#puntos)"/>

  <!-- globo que sale de la caja -->
  <path d="M598 268 q16 52 -8 94" fill="none" stroke="#5E97BC" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="598" cy="204" rx="60" ry="72" fill="url(#gGlobo)"/>
  <path d="M590 272 l8 14 8 -14z" fill="#6FB6E0"/>
  <ellipse cx="580" cy="176" rx="14" ry="20" fill="#FFFFFF" opacity="0.45"/>

  <!-- bolsita que asoma -->
  <path d="M258 290 q38 -48 76 0" fill="none" stroke="#C4397C" stroke-width="9" stroke-linecap="round"/>
  <rect x="226" y="290" width="140" height="196" rx="14" fill="url(#gBolsa)" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M226 348 h140" stroke="#FFFFFF" stroke-width="9" opacity="0.75"/>

  <!-- chupetín que asoma -->
  <path d="M434 316 v120" stroke="#F3E6CE" stroke-width="13" stroke-linecap="round"/>
  <circle cx="434" cy="276" r="56" fill="#F7C948" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M434 276 m0 -30 a30 30 0 0 1 0 60 a19 19 0 0 1 0 -38 a10 10 0 0 0 0 20"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- caja -->
  <rect x="152" y="438" width="496" height="188" rx="22" fill="url(#gCaja)" stroke="#7F63CB" stroke-width="12"/>
  <rect x="134" y="400" width="532" height="78" rx="20" fill="#DCC0F2" stroke="#7F63CB" stroke-width="12"/>
  <rect x="368" y="438" width="64" height="188" fill="#C7A9EC" opacity="0.6"/>
  <rect x="352" y="400" width="96" height="78" rx="12" fill="#C7A9EC" opacity="0.75"/>

  <ellipse cx="400" cy="648" rx="258" ry="26" fill="#5B3F93" opacity="0.13"/>

  <g opacity="0.8">
    <circle cx="126" cy="236" r="12" fill="#E5559B"/>
    <circle cx="702" cy="396" r="10" fill="#7F63CB"/>
    <rect x="696" y="156" width="20" height="20" rx="5" fill="#F7C948" transform="rotate(24 706 166)"/>
    <circle cx="112" cy="560" r="9" fill="#6FB6E0"/>
  </g>
</svg>
