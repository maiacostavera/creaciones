<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ilustración de stickers individuales troquelados">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4EEFC"/><stop offset="100%" stop-color="#D8C9F3"/>
    </linearGradient>
    <pattern id="puntos" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="16" cy="16" r="3" fill="#8460CE" opacity="0.13"/>
    </pattern>
    <linearGradient id="gEstrella" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/><stop offset="100%" stop-color="#F2A93B"/>
    </linearGradient>
    <linearGradient id="gCorazon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBB6D6"/><stop offset="100%" stop-color="#E5559B"/>
    </linearGradient>
    <linearGradient id="gCirculo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7E6F8"/><stop offset="100%" stop-color="#6FB6E0"/>
    </linearGradient>
    <linearGradient id="gRayo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCC0F2"/><stop offset="100%" stop-color="#9159C8"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#5B3F93" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#fondo)"/>
  <rect width="800" height="800" fill="url(#puntos)"/>

  <g filter="url(#sombra)">
    <!-- estrella -->
    <g transform="rotate(-12 268 262)">
      <path d="M268 158 l34 70 76 11 -55 54 13 76 -68 -36 -68 36 13 -76 -55 -54 76 -11z"
            fill="url(#gEstrella)" stroke="#FFFFFF" stroke-width="17" stroke-linejoin="round"/>
      <path d="M268 158 l34 70 76 11 -55 54 13 76 -68 -36 -68 36 13 -76 -55 -54 76 -11z"
            fill="url(#gEstrella)"/>
    </g>

    <!-- corazón -->
    <g transform="rotate(14 560 250)">
      <path d="M560 332 c-66 -56 -102 -88 -102 -128 a51 51 0 0 1 102 -22 a51 51 0 0 1 102 22 c0 40 -36 72 -102 128z"
            fill="url(#gCorazon)" stroke="#FFFFFF" stroke-width="17" stroke-linejoin="round"/>
      <path d="M560 332 c-66 -56 -102 -88 -102 -128 a51 51 0 0 1 102 -22 a51 51 0 0 1 102 22 c0 40 -36 72 -102 128z"
            fill="url(#gCorazon)"/>
    </g>

    <!-- círculo con carita -->
    <g transform="rotate(-6 262 552)">
      <circle cx="262" cy="552" r="98" fill="url(#gCirculo)" stroke="#FFFFFF" stroke-width="17"/>
      <circle cx="232" cy="528" r="11" fill="#2F5F7A"/>
      <circle cx="294" cy="528" r="11" fill="#2F5F7A"/>
      <path d="M226 574 q36 36 72 0" fill="none" stroke="#2F5F7A" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- rayo -->
    <g transform="rotate(10 552 566)">
      <path d="M576 466 l-66 112 46 6 -30 102 76 -118 -48 -6z"
            fill="url(#gRayo)" stroke="#FFFFFF" stroke-width="17" stroke-linejoin="round"/>
      <path d="M576 466 l-66 112 46 6 -30 102 76 -118 -48 -6z" fill="url(#gRayo)"/>
    </g>
  </g>
</svg>
