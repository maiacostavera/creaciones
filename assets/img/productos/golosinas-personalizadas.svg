<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ilustración de golosinas personalizadas: cajita de jugo, alfajor y chupetín">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6ECFC"/><stop offset="100%" stop-color="#E2CDF4"/>
    </linearGradient>
    <pattern id="puntos" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="16" cy="16" r="3" fill="#9257C4" opacity="0.13"/>
    </pattern>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F0E2FA"/>
    </linearGradient>
    <linearGradient id="chupe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD9EC"/><stop offset="100%" stop-color="#F06AA8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#fondo)"/>
  <rect width="800" height="800" fill="url(#puntos)"/>

  <ellipse cx="400" cy="592" rx="250" ry="26" fill="#7A4FA8" opacity="0.10"/>

  <!-- chupetín -->
  <path d="M556 318 v146" stroke="#F3E6CE" stroke-width="15" stroke-linecap="round"/>
  <circle cx="556" cy="268" r="72" fill="url(#chupe)" stroke="#FFFFFF" stroke-width="9"/>
  <path d="M556 268 m0 -42 a42 42 0 0 1 0 84 a28 28 0 0 1 0 -56 a14 14 0 0 0 0 28"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- cajita de jugo personalizada -->
  <path d="M292 268 l34 -58" stroke="#8E5EC0" stroke-width="15" stroke-linecap="round"/>
  <path d="M326 210 h46" stroke="#8E5EC0" stroke-width="15" stroke-linecap="round"/>
  <rect x="202" y="268" width="180" height="300" rx="18" fill="url(#caja)" stroke="#9257C4" stroke-width="11"/>
  <rect x="202" y="352" width="180" height="92" fill="#C79BE8" opacity="0.55"/>
  <path d="M242 400 h100" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <circle cx="292" cy="500" r="34" fill="none" stroke="#C79BE8" stroke-width="10"/>

  <!-- alfajor -->
  <circle cx="548" cy="492" r="96" fill="#F7E4CF" stroke="#C99A63" stroke-width="10"/>
  <path d="M452 492 h192" stroke="#C98A4B" stroke-width="22"/>
  <path d="M452 492 q24 16 48 0 t48 0 t48 0 t48 0" fill="none" stroke="#A8692F" stroke-width="9" opacity="0.65"/>
  <circle cx="548" cy="444" r="18" fill="#FFFFFF" opacity="0.5"/>

  <!-- confeti -->
  <g opacity="0.85">
    <circle cx="140" cy="208" r="13" fill="#F06AA8"/>
    <circle cx="672" cy="612" r="11" fill="#9257C4"/>
    <circle cx="664" cy="168" r="9" fill="#6FB6E0"/>
    <rect x="124" y="612" width="22" height="22" rx="5" fill="#F7C948" transform="rotate(22 135 623)"/>
    <rect x="684" y="416" width="18" height="18" rx="4" fill="#F06AA8" transform="rotate(-18 693 425)"/>
    <path d="M120 420 c-12 -11 -18 -17 -18 -25 a9 9 0 0 1 18 -4 a9 9 0 0 1 18 4 c0 8 -6 14 -18 25z" fill="#9257C4" opacity="0.8"/>
  </g>
</svg>
