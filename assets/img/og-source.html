<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    width: 1200px; height: 630px; position: relative;
    background: linear-gradient(150deg, #FFF7FC 0%, #F7E4F3 52%, #E9D6F7 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Quicksand", sans-serif; text-align: center;
  }
  .marco {
    position: absolute; inset: 40px; border: 3px solid rgba(219,78,150,.38); border-radius: 34px;
  }
  .globo { position: absolute; border-radius: 50% 50% 48% 48%; }
  .g1 { width: 104px; height: 128px; left: 80px;  top: 112px; background: linear-gradient(140deg,#FBB6D6,#E5559B); }
  .g2 { width: 84px;  height: 104px; left: 190px; top: 190px; background: linear-gradient(140deg,#DCC0F2,#9159C8); }
  .g3 { width: 96px;  height: 118px; right: 84px; top: 118px; background: linear-gradient(140deg,#C7E6F8,#6FB6E0); }
  .g4 { width: 76px;  height: 94px;  right: 196px; top: 200px; background: linear-gradient(140deg,#FBB6D6,#DB4E96); }
  .hilo { position: absolute; width: 3px; height: 74px; background: rgba(145,89,200,.45); border-radius: 3px; }
  .h1 { left: 131px; top: 240px; } .h2 { left: 231px; top: 294px; }
  .h3 { right: 131px; top: 236px; } .h4 { right: 233px; top: 294px; }
  .marca {
    font-family: "Pacifico", cursive; font-size: 90px; color: #BC3B7C;
    line-height: 1.25; margin-bottom: 6px;
  }
  .bajada { font-size: 33px; font-weight: 500; color: #6E5278; margin-bottom: 40px; }
  .wa {
    background: #25D366; color: #05301A; font-weight: 700; font-size: 27px;
    letter-spacing: .06em; padding: 20px 46px; border-radius: 999px;
    box-shadow: 0 10px 28px rgba(37,211,102,.32);
  }
  .datos { margin-top: 34px; font-size: 25px; font-weight: 600; color: #9159C8; }
  .corazon { position: absolute; font-size: 30px; opacity: .5; }
  .c1 { left: 150px; bottom: 120px; } .c2 { right: 158px; bottom: 132px; }
  .c3 { left: 280px; bottom: 76px; }  .c4 { right: 286px; bottom: 82px; }
</style>
</head>
<body>
  <div class="og">
    <div class="marco"></div>
    <div class="globo g1"></div><div class="hilo h1"></div>
    <div class="globo g2"></div><div class="hilo h2"></div>
    <div class="globo g3"></div><div class="hilo h3"></div>
    <div class="globo g4"></div><div class="hilo h4"></div>
    <span class="corazon c1">💗</span><span class="corazon c2">💜</span>
    <span class="corazon c3">🎀</span><span class="corazon c4">🎈</span>

    <p class="marca">Creaciones Abi</p>
    <p class="bajada">Decoración y golosinas personalizadas</p>
    <div class="wa">PEDIDOS POR WHATSAPP</div>
    <p class="datos">@crecionesabi · 11 2575-0730</p>
  </div>
</body>
</html>
